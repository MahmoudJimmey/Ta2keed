<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ta2keed — Log in</title>
<link rel="stylesheet" href="/static/style.css">
<style>
  .login{max-width:360px;margin:12vh auto;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px}
  .login input{width:100%;background:#11141a;border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:11px;font:inherit;margin:14px 0}
  .login button{width:100%;background:var(--acc);color:#000;border:0;font-weight:600;padding:11px}
  .err{color:#ff9b9b;font-size:13px;min-height:18px;margin-top:8px}
</style>
</head>
<body>
<form class="login" id="f">
  <div class="brand" style="font-size:20px"><span class="logo">✓</span> <b>Ta2keed</b></div>
  <div class="muted small" style="margin-top:6px">Owner dashboard</div>
  <input type="password" id="pw" placeholder="Password" autofocus autocomplete="current-password">
  <button>Log in</button>
  <div class="err" id="err"></div>
</form>
<script>
document.getElementById("f").onsubmit = async e => {
  e.preventDefault();
  const r = await fetch("/login", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ password: document.getElementById("pw").value }) });
  if (r.ok) location.href = new URLSearchParams(location.search).get("next") || "/";
  else document.getElementById("err").textContent = "Wrong password";
};
</script>
</body>
</html>
